<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b8f6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Svezzamento</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--ink:#2d2a26;--soft:#7a736b;--line:#ece4d8;--green:#5b8f6b;--greenbg:#e6f1ea;--peach:#e8a87c;--peachbg:#fdeee2;--red:#c0564b;--redbg:#fbe9e6;--amber:#b7862b;--amberbg:#fbf1d9;--blue:#4f7ca8;--bluebg:#e5eef7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 4px}
.muted{color:var(--soft);font-size:14px}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.card.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--green);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
button.soft{background:var(--greenbg);color:var(--green)}
button.danger{background:var(--redbg);color:var(--red)}
button.small{padding:6px 10px;font-size:13px;border-radius:10px}
button.block{width:100%}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--soft);margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--greenbg);color:var(--green);margin:2px 4px 2px 0}
.tag.peach{background:var(--peachbg);color:#b5683a}.tag.red{background:var(--redbg);color:var(--red)}.tag.amber{background:var(--amberbg);color:var(--amber)}.tag.blue{background:var(--bluebg);color:var(--blue)}.tag.gray{background:#f0ece6;color:var(--soft)}
.warn{background:var(--amberbg);color:#7a5a14;border-radius:12px;padding:9px 12px;margin:8px 0;font-size:14px}
.warn.red{background:var(--redbg);color:#8d3a31}.info{background:var(--bluebg);color:#35597d;border-radius:12px;padding:9px 12px;margin:8px 0;font-size:14px}
.seg{display:flex;background:#efe8dd;border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;background:transparent;color:var(--soft);padding:8px 6px;font-size:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:transparent;color:var(--soft);border-radius:0;padding:9px 2px 8px;font-size:11px;font-weight:600}
nav button span{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--green)}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(40,30,20,.45)}
.sheet-body{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.dots{letter-spacing:2px;color:var(--green);font-size:15px}
.bar{height:8px;border-radius:6px;background:#efe8dd;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}
.big{font-size:26px}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;flex:none}.check.done span{text-decoration:line-through;color:var(--soft)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:14px}.chk input{width:20px;height:20px;flex:none;margin-top:2px}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.mrow{display:flex;gap:6px;margin:6px 0}.mrow input{flex:1}.mrow select{width:110px;flex:none;padding:10px 6px}
ul.pts{margin:6px 0 0;padding-left:20px}ul.pts li{margin:3px 0}
.banner{background:var(--peachbg);color:#8a4d23;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.login{margin-top:15vh}
.pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:50vh;overflow:auto}

.kv{font-size:24px;font-weight:700;color:var(--ink);line-height:1.2}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.kbox .kv{font-size:20px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sgrid .sc{margin:0;padding:10px 12px}
.sgrid .sc .small{font-size:12px}
.spark{display:block;margin-top:4px}
.tapc{cursor:pointer}
.brow{display:flex;align-items:center;gap:8px;margin:7px 0;padding:3px 4px;border-radius:10px}
.brow.sel,.col.sel{background:var(--greenbg)}
.brow .bl{width:38%;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{flex:1;height:12px;border-radius:7px;background:#efe8dd;overflow:hidden}
.bt i{display:block;height:100%;background:var(--green);border-radius:7px}
.brow b{min-width:44px;text-align:right;font-size:13px}
.cols{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding:4px 0 2px}
.col{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:2px 1px}
.cb{width:100%;height:84px;display:flex;align-items:flex-end;justify-content:center}
.cb i{display:block;width:70%;background:var(--green);border-radius:6px 6px 2px 2px}
.cv{font-size:11px;margin-bottom:2px}.cl{font-size:10px;color:var(--soft);margin-top:3px;white-space:nowrap}
.heat{margin:10px 0}.hh,.hr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.hh span{text-align:center;font-size:11px;color:var(--soft)}
.hc{padding:0;height:34px;border-radius:9px;background:#efe8dd;color:var(--soft);font-size:12px;font-weight:600}
.hc.h1{background:#cfe4d6;color:#2d5a3a}.hc.h2{background:#9fcbae;color:#1f4a2c}.hc.h3{background:#6fae85;color:#fff}.hc.h4{background:#3f8a5c;color:#fff}.hc.dim{opacity:.35}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}.tbl th{font-size:12px;color:var(--soft)}
.tbl .up{color:var(--green);font-weight:600}.tbl .dn{color:var(--red);font-weight:600}
.tblw{overflow-x:auto}.tbl.mini th,.tbl.mini td{padding:4px 3px;text-align:center;font-size:12px}
.cell{padding:4px 0;width:34px;border-radius:8px;font-size:13px;font-weight:700;background:#efe8dd;color:var(--ink)}
.cell.okc{background:#cfe4d6;color:#2d5a3a}.cell.under{background:var(--amberbg);color:#8a6410}.cell.over{background:var(--redbg);color:var(--red)}.cell.wip{background:var(--bluebg);color:#35597d}
.drill{border:2px solid var(--green);border-radius:16px;padding:10px 12px;margin:14px 0;background:#fcfffc}
.drill .card{margin:8px 0}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#2d2a26;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:86vw;text-align:center}
.recipe-card{padding:14px}.recipe-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.recipe-body{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.recipe-body h4{font-size:13px;margin:0 0 5px;color:var(--soft);text-transform:uppercase;letter-spacing:.03em}.recipe-ings{display:flex;flex-wrap:wrap;gap:5px;margin:0}.recipe-ings span{background:var(--greenbg);color:#315f3f;border-radius:999px;padding:4px 8px;font-size:13px}.recipe-prep{white-space:pre-wrap;font-size:14px;margin:8px 0 0}.recipe-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.recipe-actions button{flex:1;min-width:110px}
nav button{font-size:10px}nav button span{font-size:19px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" style="display:none"></nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-a="chiudi"></div><div class="sheet-body" id="sheetBody"></div></div>

<script src="config.js"></script>
<script type="module">
/* ============================================================
   SVEZZAMENTO - webapp personale (versione 4)
   Dati: Firebase (Authentication + Firestore). Senza config: modalità prova locale.
   ============================================================ */
const APP_VERSION = 4;
const NOTE_RILASCIO = [
  {v:1, titolo:'Prima versione', punti:[
    'Oggi: diario dei pasti con avvisi (cibi da evitare, allergeni nuovi, più fonti proteiche nello stesso pasto).',
    'Settimana: contatori delle frequenze (carne, pesce, uova, legumi, formaggi), menu settimanale e lista della spesa.',
    'Piatti: ricettario personale con idee di partenza (solo titoli) e piatti preferiti.',

  ]}
];

const cfg = window.APP_CONFIG || {};
const fb = cfg.firebase || {};
const demo = !fb.apiKey || String(fb.apiKey).startsWith('INCOLLA') || location.search.includes('demo');

/* ---------- utilità ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return iso(d); };
const fmt = s => parse(s).toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'short'});
const fmtLong = s => parse(s).toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric'});
function eta(nascita, ref = new Date()) {
  const b = parse(nascita);
  let m = (ref.getFullYear()-b.getFullYear())*12 + ref.getMonth() - b.getMonth();
  let d = ref.getDate() - b.getDate();
  if (d < 0) { m--; d += new Date(ref.getFullYear(), ref.getMonth(), 0).getDate(); }
  return {m, d};
}
const addMonths = (s, n) => { const d = parse(s); d.setMonth(d.getMonth()+n); return iso(d); };

/* ---------- dati di riferimento (dagli appunti e dai documenti) ---------- */
const MOMENTI = {colazione:'Colazione', spuntino:'Spuntino', pranzo:'Pranzo', merenda:'Merenda', cena:'Cena'};

};
const ALL_KW = {

const REAZ = {da_valutare:['In osservazione','amber'], nessuna:['Nessuna reazione','green'], lieve:['Reazione lieve','peach'], importante:['Reazione importante','red']};
const TAPPE = [
  {da:0, a:5, titolo:'Prima di iniziare', punti:[

    'Utile avere: contenitori, frullatore a immersione, passaverdure (per i legumi), pentola a pressione o elettrica.',
    'Tieni scorte in freezer e qualche pappa pronta per le giornate di fretta.',
    'Prepara un menu settimanale: una fonte proteica per ogni giorno e qualche piatto che sai che piace.']},
  {da:6, a:8, titolo:'Inizio (6-8 mesi)', punti:[

const REGOLE = [

  ['Il piatto', ['Un quarto proteine, un quarto frutta e verdura, metà carboidrati.','Piatto unico oppure componenti separate: separate le riconosce meglio.','Il primo va fatto anche a cena, perché il pane non copre il fabbisogno di carboidrati.','Variare sempre; frutta e verdura di stagione, seguendo i 5 colori.']],

/* ---------- livello dati (Firebase oppure prova locale) ---------- */
let DB = null;
function mockDB() {
  const subs = {};

/* ---- alimenti ---- */
function foodsOf(txt) {
  return String(txt || '').toLowerCase().replace(/[()]/g, ',').split(/[,;+\n]|\s+e\s+|\s+con\s+|\s+ed\s+/)
    .map(x => x.replace(/[^a-zà-ù' ]/g, ' ').replace(/\bun po'|\bun pò/g, ' ').split(/\s+/).filter(w => w && !STOPW.has(w) && w.length > 1).join(' ').trim())
    .filter(x => x.length >= 3);
}
const stemW = w => w.length > 4 ? w.replace(/[aeio]$/, '') : w;
const fkey = f => f.split(' ').map(stemW).join(' ');
const GVAL = {si: 2, ni: 1, no: 0};
let _fi = null, _fiSig = '';
function foodIndex() {
  const sig = S.pasti.length + '|' + S.pasti.map(p => p.id + (p.alimenti || '').length).join(',');
  if (_fi && sig === _fiSig) return _fi;
  const m = new Map();
  const list = [...S.pasti].sort((a, b) => a.data.localeCompare(b.data) || ORDINE_MOM.indexOf(a.momento) - ORDINE_MOM.indexOf(b.momento));
  for (const p of list) {
    const seen = new Set();
    for (const f of foodsOf(p.alimenti)) {
      const k = fkey(f); if (seen.has(k)) continue; seen.add(k);
      let e = m.get(k);
      if (!e) { e = {k, names: {}, count: 0, pasti: [], first: p.data, last: p.data, g: {si: 0, ni: 0, no: 0}, lastG: ''}; m.set(k, e); }
      e.names[f] = (e.names[f] || 0) + 1; e.count++; e.pasti.push(p); e.last = p.data;
      if (p.gradimento) { e.g[p.gradimento]++; e.lastG = p.gradimento; }
    }
  }
  m.forEach(e => { e.name = Object.entries(e.names).sort((a, b) => b[1] - a[1])[0][0]; });
  _fi = m; _fiSig = sig; return m;
}
const colorsOfFood = f => Object.keys(COL_RX).filter(c => COL_RX[c].test(f));
function colorsOfPasti(pasti) {
  const out = {}; Object.keys(COLORI).forEach(c => out[c] = new Map());
  for (const p of pasti) for (const f of foodsOf(p.alimenti)) for (const c of colorsOfFood(f)) { const k = fkey(f); const e = out[c].get(k) || {name: f, pasti: []}; e.pasti.push(p); out[c].set(k, e); }
  return out;
}
function seasonList(nome) {
  const r = S.riferimenti.find(x => x.tipo === 'stagione' && x.stagione === nome);
  if (!r) return null;
  const words = new Set();
  (r.sezioni || []).forEach(s => (s.voci || []).forEach(v => v.toLowerCase().replace(/[^a-zà-ù ]/g, ' ').split(/\s+/).filter(w => w.length >= 4 && !['patate', 'stagione'].includes(w) || w === 'patate').forEach(w => words.add(stemW(w)))));
  return words;
}
function stagioneDi(d) { return stagioneNow(parse(d)); }
const isProduce = f => PRODUCE_RX.test(f);
function inSeason(f, d) {
  const l = seasonList(stagioneDi(d)); if (!l) return null;
  return f.split(' ').some(w => w.length >= 4 && l.has(stemW(w)));
}

function pastoHasAll(p, k) {
  const t = (p.alimenti || '').toLowerCase().replace(ALL_ESCLUDI, ' '), w = tokens(t);

}

const kpiBox = (v, l) => `<div class="kbox"><div class="kv">${v}</div><div class="muted small">${l}</div></div>`;
function barsH(items, stat) {
  if (!items.length) return '<div class="muted">Nessun dato nel periodo.</div>';
  const max = Math.max(1, ...items.map(i => i.v));
  return items.map(i => `<div class="brow tapc ${ui.drill && ui.drill.k === i.k ? 'sel' : ''}" data-a="drill" data-s="${stat}" data-v="${esc(i.k)}"><span class="bl">${esc(i.l)}</span><div class="bt"><i style="width:${Math.max(2, Math.round(i.v / max * 100))}%;${i.c ? 'background:' + i.c : ''}"></i></div><b>${i.t ?? i.v}</b></div>`).join('');
}
function colsV(items, stat) {
  if (!items.length) return '<div class="muted">Nessun dato nel periodo.</div>';
  const max = Math.max(1, ...items.map(i => i.v));
  return `<div class="cols">` + items.map(i => `<div class="col tapc ${ui.drill && ui.drill.k === i.k ? 'sel' : ''}" data-a="drill" data-s="${stat}" data-v="${esc(i.k)}"><b class="cv">${i.t ?? i.v}</b><div class="cb"><i style="height:${Math.max(i.v ? 4 : 0, Math.round(i.v / max * 100))}%"></i></div><span class="cl">${esc(i.l)}</span></div>`).join('') + `</div>`;
}
function spark(vals) {
  if (!vals || vals.length < 2) return '';
  const max = Math.max(1, ...vals), w = 90, h = 26, st = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * st).toFixed(1)},${(h - 2 - v / max * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="#5b8f6b" stroke-width="2" stroke-linejoin="round" points="${pts}"/></svg>`;
}
const chipsFood = (list, stat) => `<div class="chips" style="margin:6px 0">` + list.map(e => `<button class="chip" data-a="drill" data-s="${stat}" data-v="f:${esc(e.k)}">${esc(e.name)}${e.count ? ' · ' + e.count : ''}</button>`).join('') + `</div>`;
const weekCols = (fn, stat, weeks) => colsV((weeks || weeksInPeriod(12)).map(w => ({k: 'w:' + w, l: fmtS(w), v: fn(w)})), stat);
const pastiWeek = w => S.pasti.filter(p => p.data >= w && p.data <= addDays(w, 6));
const nodata = '<div class="card muted">Servono alcuni pasti registrati per vedere questa statistica.</div>';

/* ---- drill condivisi ---- */
function drillFood(k) {
  const e = foodIndex().get(k); if (!e) return null;
  const g = e.g, ngr = g.si + g.ni + g.no;
  return {titolo: e.name[0].toUpperCase() + e.name.slice(1), pasti: e.pasti, html: `<div class="muted small">Provato la prima volta il ${fmtLong(e.first)} · ultima volta il ${fmtLong(e.last)} · ${e.count} ${e.count === 1 ? 'volta' : 'volte'}${ngr ? `<br>Com'è andata: 😋 ${g.si} · 😐 ${g.ni} · 😕 ${g.no}` : ''}</div>`};
}
function drillWeekPasti(w, extra = '') { return {titolo: `Settimana ${fmt(w)} – ${fmt(addDays(w, 6))}`, pasti: pastiWeek(w), sintomi: S.sintomi.filter(s => s.data >= w && s.data <= addDays(w, 6)), html: extra}; }
function drillDay(d) {
  const g = S.giorni.find(x => x.id === d);
  return {titolo: fmt(d), pasti: S.pasti.filter(p => p.data === d), sintomi: S.sintomi.filter(s => s.data === d), html: `<div class="muted small">${g ? `💧 ${g.acqua || 0} ml · 🍼 ${g.latte || 0} poppate` : 'Nessun dato di acqua/latte'} · <a href="#" data-a="vaiGiorno" data-v="${d}">apri il giorno</a></div>`};
}

function stagStat() {

    if (s) { res.inn++; if (!seenIn.has(e.k)) { seenIn.add(e.k); res.listIn.push(e); } } else if (!seenOut.has(e.k)) { seenOut.add(e.k); res.listOut.push(e); }

function menuStat(ws) {
  let ok = 0, tot = 0; const righe = [];
  ws.forEach(w => {
    const menu = S.menu.find(x => x.id === w); if (!menu || !menu.giorni) return;
    for (let d = 0; d < 7; d++) for (const m of ['pranzo', 'cena']) {
      const c = menu.giorni[d] && menu.giorni[d][m]; if (!c || !(c.t || c.p)) continue;
      const day = addDays(w, d); if (day > today()) continue;
      const ps = S.pasti.filter(p => p.data === day && p.momento === m);
      const hit = ps.some(p => (c.t && normName(p.alimenti || '').includes(normName(c.t))) || (c.p && (p.prot || []).includes(c.p)));

function regoleSett(w) {

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
A.proponiMenu = async () => {
  const ws = ui.week, F2 = getFreq(), menu = S.menu.find(x => x.id === ws) || {giorni: {}};
  const giorni = JSON.parse(JSON.stringify(menu.giorni || {})), slots = [], nuoviPiatti = [];
  for (let d = 0; d < 7; d++) for (const m of ['pranzo', 'cena']) { const c = giorni[d] && giorni[d][m]; if (!(c && (c.t || c.p))) slots.push([d, m]); }
  if (!slots.length) { toast('Il menu di questa settimana è già pieno'); return; }
  const planned = {}; PROT.forEach(k => planned[k] = 0);
  Object.values(giorni).forEach(g => ['pranzo', 'cena'].forEach(m => { const c = g[m]; if (c && c.p) planned[c.p]++; }));
  const done = freqSettimana(ws).done, need = [];
  PROT.forEach(k => { let n = F2[k][0] - planned[k] - done[k]; while (n-- > 0) need.push(k); });
  const order = ['pesce', 'legumi', 'formaggi', 'uova', 'carne']; let guard = 0;
  while (need.length < slots.length && guard++ < 40) { let added = false; for (const k of order) { if (need.length >= slots.length) break; if (planned[k] + done[k] + need.filter(x => x === k).length < F2[k][1]) { need.push(k); added = true; } } if (!added) break; }
  shuffle(need); const bad = a => a.some((x, i) => i && x === a[i - 1]); for (let t = 0; t < 40 && bad(need); t++) shuffle(need);
  const cur = stagioneNow(), usati = new Set(); let senza = 0;
  slots.forEach(([d, m], i) => {
    const k = need[i]; if (!k) return;
    const cands = S.piatti.filter(p => p.prot === k && p.tipo !== 'merenda' && !usati.has(p.id));
    const score = p => (p.piace ? 3 : 0) + ((p.stagione || '').includes(cur) || !p.stagione ? 2 : 0) + (p.ingredienti ? 1 : 0) - (usoPiatto(p) ? 2 : 0) + Math.random() * 2;
    const pick = cands.sort((a, b) => score(b) - score(a))[0];
    if (!pick) senza++; else { usati.add(pick.id); nuoviPiatti.push(pick); }
    giorni[d] = giorni[d] || {}; giorni[d][m] = {t: pick ? pick.nome : '', p: k, i: pick ? pick.id : ''};
  });
  await DB.put('menu', ws, {giorni});
  const aggiunti = await spesaAdd(nuoviPiatti.flatMap(ingredientiLista));
  toast(senza ? `Menu proposto e spesa aggiornata (${aggiunti} nuove voci); per alcune proteine mancano piatti` : `Menu proposto · ${aggiunti ? aggiunti + ' ingredienti aggiunti alla spesa' : 'spesa già aggiornata'}`);
};

    for (const np of d.piatti) {
      const old = byId.get(np.id) || byName.get(normName(np.nome)), id = old ? old.id : np.id;
      await DB.put('piatti', id, {nome: np.nome, prot: (old && old.prot) || np.prot || '', ingredienti: np.ingredienti || (old && old.ingredienti) || '', preparazione: np.preparazione || (old && old.preparazione) || '', fonte: np.fonte || (old && old.fonte) || '', stagione: np.stagione || (old && old.stagione) || '', tipo: np.tipo || (old && old.tipo) || 'ricetta', note: (old && old.note) || '', piace: old ? !!old.piace : false});
      n++; if (!old) nuovi++; if (n % 20 === 0) say(`Piatti: ${n}/${d.piatti.length}…`);
    }
    for (const r of d.riferimenti) await DB.put('riferimenti', r.id, r);
    importing = false; say(`Fatto: ${n} piatti (${nuovi} nuovi) e ${d.riferimenti.length} elenchi importati.`); render();
  } catch (e) { importing = false; say('Importazione non riuscita: ' + e.message); }
}

function docAssistente() {
  const storia = NOTE_RILASCIO.map(n => `- Versione ${n.v} - ${n.titolo}: ${n.punti.join(' ')}`).join('\n');
  return `DOCUMENTO PER L'ASSISTENTE - APP "SVEZZAMENTO" (versione ${APP_VERSION})

SCOPO
Webapp personale e privata per gestire lo svezzamento di un bimbo nato il ${imp().nascita}, usata da due genitori quasi solo da telefono. Non è collegata ad account di lavoro. Si tengono solo nome e data di nascita. Le regole vengono dagli appunti della moglie (dietiste dei documenti: Valentina Masi, Verdiana Ramina/Nutricam). L'app è un promemoria delle regole della famiglia e non sostituisce il pediatra.

STACK E FILE
- index.html (HTML, CSS e JavaScript in un solo file, nessuna build) + config.js con la configurazione Firebase.
- Hosting: GitHub Pages (repository pubblico: contiene SOLO index.html e config.js). Database: Firebase Firestore. Accesso: Firebase Authentication email e password per i due genitori. Regole Firestore: solo le due email autorizzate.
- dati-iniziali.json (ricettario e liste ricavati dai PDF, che hanno clausola di non diffusione) NON va su GitHub: si importa dal telefono da Altro > Importa dati iniziali e finisce nel database privato.
- Senza configurazione Firebase l'app parte in modalità prova (localStorage).
- Per aggiornare: sostituire index.html nel repository (Add file > Upload files > Commit), non toccare config.js, chiudere e riaprire l'app.
- Regole di lavoro: a ogni modifica aumentare APP_VERSION, aggiungere una voce in NOTE_RILASCIO e aggiornare questo documento quando serve.

SCHEDE
Oggi (pasti del giorno, acqua e latte, sintomi) / Settimana (Frequenze, Menu con spesa automatica e «Proponi un menu», Spesa con importazione liste) / Piatti (ricettario con ricerca, filtri e ricetta visibile direttamente nella lista) / Salute (Allergeni, Sintomi) / Statistiche (29 schede cliccabili con drill-down) / Altro (Regole, Tappe, Guida v3 e fonti, Dispensa e congelatore, Frutta e verdura di stagione, Impostazioni, Novità, Importa dati iniziali, Documento, Guida).

DATI (collezioni Firestore)
- pasti: data (AAAA-MM-GG), ora (HH:MM, facoltativa), momento (colazione, spuntino, pranzo, merenda, cena), alimenti (testo libero), comp (carbo, verdura, frutta), prot (carne, pesce, uova, legumi, formaggi), consistenza (liscia, schiacciata, pezzettini, solida), gradimento (no, ni, si), tavola (bool), note, autore.
- sintomi: data, tipo (cacca_ok, cacca_dura, cacca_molle, rigurgito, vomito, pelle, altro), intensita (lieve, media, forte), note.
- allergeni: id = chiave (latte, uova, pesce, crostacei, fruttasecca, arachidi, sesamo, grano); data introduzione, reazione (da_valutare, nessuna, lieve, importante), note. Esiste solo se introdotto.
- menu: id = data del lunedì; giorni[0..6][pranzo|cena] = {t: piatto, p: fonte proteica, i: id del piatto se riconosciuto}. Inserire un piatto del ricettario aggiunge automaticamente gli ingredienti alla spesa.
- spesa: testo, fatto, ts.
- piatti: nome, prot, ingredienti (voci separate da «; »), preparazione (facoltativa), fonte (documento e pagina), stagione, tipo (ricetta, merenda, idea), piace, note. Ingredienti e preparazione sono mostrati direttamente nella lista Piatti. Gli id che iniziano con imp_ vengono dall'importazione.
- riferimenti: tipo dispensa, freezer, stagione (voci di frutta e verdura per autunno e inverno) e spesa (liste settimanali 1-4 di autunno e inverno), con sezioni[{titolo, voci}].
- scorte: id = dispensa o freezer; ok = elenco delle voci già in casa.
- giorni: id = data; acqua (ml), latte (numero di poppate o biberon).
- settings/main: nome, nascita, freq (obiettivi settimanali per fonte proteica come [min, max], opzionale).

REGOLE DELL'APP (dagli appunti)
- Obiettivi settimanali di partenza: carne 2, pesce 3-4, uova 2, legumi 3-4, formaggi 2-3 (modificabili).
- Avvisi non bloccanti: più fonti proteiche nello stesso pasto; cibi da evitare (miele, zucchero, succhi, biscottini/Plasmon, margarina e oli vegetali, funghi, crudi, frutti di mare, pane in cassetta, cracker salati, omogeneizzati, spezie piccanti; sotto i 12 mesi integrale e latte vaccino come alimento; dolci fino a 2 anni); allergeni nuovi uno alla volta.
- Acqua: obiettivo 800 ml tra 6 e 12 mesi, 1200 ml da 1 a 3 anni.
- Piatto ideale: 1/4 proteine, 1/4 frutta e verdura, 1/2 carboidrati. Niente tabelle di quantità (le grammature dei menù famiglia non sono importate).
- I documenti non coincidono su alcune frequenze (carne, uova): vale quanto scritto negli appunti.

STATISTICHE (ogni barra, colonna e riga apre il dettaglio con i pasti o i sintomi corrispondenti)
Panoramica: pasti registrati, calendario dei giorni, questa settimana vs scorsa, percorso. Rispetto delle regole: regole della settimana, frequenze nel tempo, fonti proteiche, composizione del piatto, avvisi, pasti a tavola. Gusti e varietà: alimenti più frequenti, alimenti nuovi, da riproporre, varietà settimanale, 5 colori, frutta e verdura di stagione, gradimento, consistenze, ricettario provato/da provare, menu pianificato vs mangiato. La giornata: momenti, orari, chi registra, acqua, latte. Salute: allergeni, sintomi, cosa ha mangiato prima dei sintomi (con avvertenza: non è causalità), pancia e cacca.
Gli alimenti sono letti dal testo dei pasti (separati da virgole, «e», «con»). Le liste di stagione dei documenti coprono solo autunno e inverno.

PREFERENZE DI CHI USA L'APP
Italiano, da telefono, budget zero (strumenti gratuiti), procedure passo passo senza competenze di sviluppo, avvisi non bloccanti, stile chiaro e rassicurante, statistiche cliccabili.

VERSIONE 4 - RICETTE E SPESA AUTOMATICA
- La lista Piatti mostra direttamente ingredienti, preparazione disponibile, note e fonte; la scheda separata resta per pianificare o modificare.
- Il menu collega il piatto tramite id quando possibile e aggiunge subito gli ingredienti alla spesa, con deduplica.
- La stessa automazione copre inserimento manuale, Pianifica, Proponi un menu e copia della settimana precedente.
- Il JSON privato resta sintetico: non incorpora integralmente testi protetti; il campo preparazione può essere completato nell’app.

VERSIONE 3 - DOCUMENTAZIONE E CRITERI
- Audit della cartella Materiale Svezzamento: 91 elementi (36 PDF, 53 immagini, 1 ODT, 1 ZIP) più i 5 PDF iniziali.
- Nuova area Guida v3 e fonti con criteri di avvio, sicurezza a tavola, tagli per oltre 30 alimenti, fonti per ambito e 12 conflitti espliciti.
- Restano prioritarie le regole degli appunti. Per il miele si mostra anche l'avvertenza prudenziale dei documenti istituzionali: niente miele nel primo anno.
- I testi completi dei PDF non vengono incorporati o pubblicati; dati-iniziali.json contiene solo metadati sintetici per uso privato.
- Statistiche v2 mantenute cliccabili e con drill-down.

STORIA DELLE VERSIONI
${storia}

PUNTI APERTI
- Nome del bimbo da inserire in Altro > Impostazioni.
- Completare facoltativamente il campo Preparazione per le idee importate che hanno solo ingredienti sintetici.
- Promemoria per gli allergeni in osservazione non ancora previsti.
- Verificare periodicamente con il pediatra le regole familiari e le indicazioni più prudenziali.
- Aggiornare le fonti se vengono aggiunti nuovi documenti alla cartella.
`;
}

function loginView(msg = '') {
  $('#nav').style.display = 'none';
  $('#app').innerHTML = `<div class="login"><h1>Svezzamento 🥣</h1><div class="muted">Accedi con l'email e la password create per voi due.</div><div class="card"><label class="f">Email</label><input id="lgMail" type="email" autocomplete="username"><label class="f">Password</label><input id="lgPwd" type="password" autocomplete="current-password" data-enter="doLogin"><div style="margin-top:14px"><button class="block" data-a="doLogin">Entra</button></div>${msg ? `<div class="warn red">${esc(msg)}</div>` : ''}</div></div>`;
}
A.doLogin = async () => {
  try { await DB.login($('#lgMail').value.trim(), $('#lgPwd').value); }
  catch (e) { const m = {'auth/invalid-credential':'Email o password non corrette.','auth/invalid-email':'Email non valida.','auth/too-many-requests':'Troppi tentativi: riprova tra qualche minuto.','auth/network-request-failed':'Nessuna connessione.'}[e.code] || ('Accesso non riuscito (' + (e.code || e.message) + ').'); loginView(m); }
};
(async function main() {
  $('#app').innerHTML = '<div class="muted" style="margin-top:30vh;text-align:center">Caricamento…</div>';
  try {
    if (demo) { DB = mockDB(); startSubscriptions(); render(); }
    else {
      DB = await firebaseDB();
      let started = false;
      DB.onUser(u => {
        DB.user = u;
        if (!u) { loginView(); return; }
        if (!started) { started = true; startSubscriptions(); }
        render();
      });
    }
  } catch (e) { $('#app').innerHTML = `<div class="warn red">Impossibile avviare l'app: ${esc(e.message)}. Controlla config.js e la connessione.</div>`; }
})();
</script>
</body>
</html>
